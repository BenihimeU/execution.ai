services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: execution
      POSTGRES_PASSWORD: execution
      POSTGRES_DB: execution_ai
    ports:
      - "5432:5432"
    volumes:
      - execution_ai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execution -d execution_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  execution_ai_postgres:

